<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal del odontólogo · {{ lab_nombre }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="pub">
<div class="pub-wrap">
  <div class="brand text-white"><span>{{ lab_nombre }}</span></div>
  <div class="pub-hero"><h1>Portal del odontólogo</h1><p>Sigue tu trabajo en tiempo real, sin llamadas.</p></div>
  <form method="post" class="card"><div class="card-body">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <label class="form-label">Código de seguimiento</label>
    <input name="codigo" class="form-control form-control-lg mb-3 text-uppercase" placeholder="LD-0001-AB12C" required autofocus>
    <button class="btn btn-primary w-100 py-2"><i class="bi bi-search"></i> Consultar</button>
    <p class="text-muted small mt-3 mb-0">Lo encuentras en la etiqueta de la caja o escaneando su código QR.</p>
  </div></form>
</div>
</body>
</html>
