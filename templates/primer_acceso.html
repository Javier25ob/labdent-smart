<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear administrador · {{ lab_nombre }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="pub">
<div class="pub-wrap">
  <div class="brand text-white"><span>LABDENT <b>SMART</b></span></div>
  <div class="pub-hero"><h1>Bienvenido: crea tu cuenta</h1><p>Será la cuenta de administrador del laboratorio. Solo se pide esta vez.</p></div>
  <form method="post" class="card"><div class="card-body">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <label class="form-label">Tu nombre</label>
    <input name="nombre" class="form-control mb-3" value="{{ request.form.get('nombre', '') }}" required autofocus>
    <label class="form-label">Usuario para entrar</label>
    <input name="usuario" class="form-control mb-3" value="{{ request.form.get('usuario', '') }}" autocomplete="username" required>
    <label class="form-label">Contraseña</label>
    <input name="clave" type="password" class="form-control" autocomplete="new-password" minlength="{{ min }}" required>
    <div class="form-text mb-3">Mínimo {{ min }} caracteres. Guárdala bien: más adelante podrás crear cuentas para tu equipo y para tus odontólogos.</div>
    <label class="form-label">Repite la contraseña</label>
    <input name="clave2" type="password" class="form-control mb-3" autocomplete="new-password" minlength="{{ min }}" required>
    <button class="btn btn-primary w-100 py-2"><i class="bi bi-shield-check"></i> Crear cuenta y entrar</button>
  </div></form>
</div>
</body>
</html>
