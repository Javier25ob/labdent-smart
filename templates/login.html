<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · {{ lab_nombre }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="pub">
<div class="pub-wrap">
  <div class="brand text-white"><span>LABDENT <b>SMART</b></span></div>
  <div class="pub-hero"><h1>Panel del laboratorio</h1><p>Acceso para administradores y técnicos.</p></div>
  <form method="post" class="card"><div class="card-body">
    {% with mensajes = get_flashed_messages(with_categories=true) %}{% for cat, msg in mensajes %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}{% endwith %}
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <label class="form-label">Usuario</label>
    <input name="usuario" class="form-control mb-3" required autocomplete="username" autofocus>
    <label class="form-label">Contraseña</label>
    <input name="clave" type="password" class="form-control mb-3" autocomplete="current-password" required>
    <button class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
    <p class="text-muted small mt-3 mb-0">¿Eres odontólogo? <a href="/portal/login">Entra al portal del cliente</a>.</p>
  </div></form>
</div>
</body>
</html>
